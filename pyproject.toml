[project]
name = "openfloat"
version = "0.1.0"
description = "OpenFloat: an open protocol for financing at the payment layer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "cryptography>=50.0.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
]

[project.scripts]
openfloat = "openfloat:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
]
